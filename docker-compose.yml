services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

  frontend:
    build:
      context: ./code-review-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./code-review-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
